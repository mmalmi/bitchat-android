name: Android CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21.0.11+10.0.LTS
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      # Production JVM tests run independently in the NDR pull request's normal CI.
      - name: Build pinned native runtime
        run: |
          source tools/arti-build/TOOLCHAIN.env
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" \
            aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          sdkmanager="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "::error::Android SDK command-line tools are unavailable"
            exit 1
          fi
          "$sdkmanager" "ndk;$ANDROID_NDK_VERSION"
          cargo "+$RUST_VERSION" install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          ./app/src/main/ndr-ffi/build-android.sh --check-bindings
      - name: Build lab APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ndr-physical-lab-apk
          path: app/build/outputs/apk/debug/*.apk
